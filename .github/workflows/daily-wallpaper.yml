name: Daily Gita Wallpaper

on:
  schedule:
    # 05:15 UTC = 00:15 EST / 01:15 EDT (America/Toronto)
    - cron: '15 5 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional override date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install EB Garamond font
        run: sudo apt-get update && sudo apt-get install -y fonts-ebgaramond

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily wallpapers
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python3 src/generate.py --out dist --date "$INPUT_DATE"
          else
            python3 src/generate.py --out dist
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
